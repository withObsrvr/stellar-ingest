name: Release

# SEC-10: released binaries and images MUST be built in CI from a signed tag
# and signed with Sigstore, shipping an SBOM and SLSA provenance. VER-12: the
# artifacts carry checksums, and a release that cannot be reproduced from its
# tag is not a release.
#
# workflow_dispatch exists so the pipeline can be exercised without cutting a
# release. It defaults to a dry run: everything builds, the SBOM and the
# attestations are produced, and nothing is published.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attest, but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The tag is the input to everything below, so it is checked before any
  # artifact exists. Two things can be wrong and both are silent: an
  # unsigned tag (SEC-10 wants provenance rooted in one), and a tag whose
  # number disagrees with internal/domain.SemVer, which would ship a binary
  # reporting a release it is not.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        name: Resolve and check the release version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            dry_run=false
          else
            version=$(sed -n 's/^var SemVer = "\(.*\)"$/\1/p' internal/domain/version.go)
            dry_run=${{ inputs.dry_run }}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "releasing $version (dry_run=$dry_run)"
          make release-check EXPECT_VERSION="$version"

      # Checked through the API, not with git.
      #
      # actions/checkout fetches a tag push as `+<sha>:refs/tags/<name>`,
      # which recreates the tag LOCALLY as a lightweight ref pointing at the
      # commit -- the annotation object, and with it the signature, is never
      # fetched. `git cat-file -t v0.1.1` therefore says "commit" for a tag
      # that is annotated and signed on the remote, and the first real
      # release failed on exactly that. The API reports the tag as it
      # actually exists.
      - name: Tag must be annotated and signed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')
          if [ "$type" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; releases are cut from annotated, signed tags (VER-12)"
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          signed=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.signature != null')
          if [ "$signed" != "true" ]; then
            echo "::error::$GITHUB_REF_NAME is not signed (VER-12). Re-tag with git tag -s."
            exit 1
          fi
          echo "✓ $GITHUB_REF_NAME is annotated and signed"
          # Whether GitHub can VERIFY the signature depends on the signing key
          # being registered on the account, which CI cannot fix. Surfaced,
          # not enforced: an unregistered key is a profile setting, not a
          # defect in the release.
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.verified')
          reason=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.reason')
          echo "GitHub verification: verified=$verified reason=$reason"
          [ "$verified" = "true" ] || echo "::warning::tag signature is unverified ($reason). Register the signing key at github.com/settings/keys as a Signing Key."

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Sigstore, via the attestation action
      attestations: write
    env:
      GOWORK: "off"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++

      # Built inside bookworm, not on the runner. The glibc floor of a
      # released binary is set by the machine that built it, and
      # ubuntu-latest set v0.1.1's at 2.38 -- which does not run on Debian
      # 12, Ubuntu 22.04, RHEL 9 or Amazon Linux 2023. Measured floor from
      # this image: 2.34.
      #
      # Still a make target, so a maintainer can reproduce what CI published
      # without reading this file.
      - name: Build artifacts (portable)
        run: |
          make dist-portable \
            EXPECT_VERSION=${{ needs.verify.outputs.version }} \
            GIT_SHA="$(git rev-parse --short HEAD)" \
            BUILD_DATE="$(git log -1 --pretty=%cI)"

      # The floor is the point, so it is checked rather than assumed, and on
      # the oldest base we claim to support. Reading symbol versions would
      # test the same thing less honestly than letting the dynamic linker
      # do what a user's first invocation does.
      - name: Artifact runs on the oldest supported base
        run: make dist-verify-portable

      - id: stage
        run: echo "path=$(make -s print-dist-stage)" >> "$GITHUB_OUTPUT"

      # Scanned against the BINARY, not the dist directory. syft reads Go
      # build info out of the executable and lists every module compiled in;
      # pointed at a directory holding only a .tar.gz it catalogues nothing,
      # which is how the first dry run produced a well-formed SBOM with zero
      # components. The primary binary rather than the whole staging dir, so
      # the compat alias -- a byte-identical copy -- does not list every
      # module twice.
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.stage.outputs.path }}/stellar-ingest
          format: cyclonedx-json
          output-file: dist/stellar-ingest_${{ needs.verify.outputs.version }}.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      # An SBOM nobody checks is a file, not a bill of materials. The failure
      # it guards is silent by construction: an empty one is valid CycloneDX
      # and passes every schema check.
      - name: SBOM lists something
        run: |
          sbom=dist/stellar-ingest_${{ needs.verify.outputs.version }}.cyclonedx.json
          count=$(python3 -c "import json;print(len(json.load(open('$sbom')).get('components',[])))")
          echo "SBOM lists $count components"
          if [ "$count" -lt 1 ]; then
            echo "::error::SBOM has no components — it is describing nothing (SEC-10)"
            exit 1
          fi

      # SLSA v1 provenance, signed through Sigstore and recorded in the
      # transparency log. This is what makes "built in CI from this commit"
      # checkable by someone who trusts neither us nor the artifact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      # Only the publishable files: the staging directory stays on disk for
      # the SBOM scan and would otherwise double the upload.
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.cyclonedx.json
            dist/SHA256SUMS
          retention-days: 7

  # Depends on binaries, not just verify. They used to run in parallel, and
  # when the artifact build failed for v0.1.2 the image published anyway --
  # ghcr got :0.1.2 and :latest for a release that does not exist, with no
  # tarball, no SBOM and no GitHub Release beside it. A registry tag is the
  # most public thing this workflow writes; it should be the last.
  image:
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ghcr rather than Docker Hub: it authenticates with the workflow's own
      # token, so a release needs no long-lived registry credential stored as
      # a secret (SEC-1). Mirroring to another registry is a separate step
      # with its own credential if it is ever wanted.
      - uses: docker/login-action@v3
        if: needs.verify.outputs.dry_run == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ needs.verify.outputs.dry_run == 'false' }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.pushed_at }}
          tags: |
            ghcr.io/withobsrvr/stellar-ingest:${{ needs.verify.outputs.version }}
            ghcr.io/withobsrvr/stellar-ingest:latest
          provenance: false   # replaced by the attestation below

      - name: Attest image provenance
        if: needs.verify.outputs.dry_run == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/withobsrvr/stellar-ingest
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [verify, binaries, image]
    if: needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      # The notes are the changelog's own section, not a generated commit
      # list: VER-11 asks for a human entry, and duplicating it here by hand
      # is how the two drift.
      - name: Extract the changelog section
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f && /^\[.*\]: http/ {next}   # link definitions belong to the file, not the notes
            f {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ needs.verify.outputs.version }} (VER-11)"
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "Artifacts carry SLSA build provenance and a CycloneDX SBOM. Verify with:"
            echo
            echo '```sh'
            echo "gh attestation verify stellar-ingest_${{ needs.verify.outputs.version }}_linux_amd64.tar.gz -R $GITHUB_REPOSITORY"
            echo '```'
          } >> release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.cyclonedx.json
            dist/SHA256SUMS
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
